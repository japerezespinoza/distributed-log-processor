services:
  # PostgreSQL stores jobs, leases, retry state, and completion results.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: logprocessor
      POSTGRES_USER: logprocessor
      POSTGRES_PASSWORD: logprocessor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logprocessor -d logprocessor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The coordinator owns job claiming, leases, completion, and retry transitions.
  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logprocessor
      SPRING_DATASOURCE_USERNAME: logprocessor
      SPRING_DATASOURCE_PASSWORD: logprocessor
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Worker instance one claims and processes jobs using the shared test-log directory.
  worker-1:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      WORKER_ID: worker-1
      COORDINATOR_URL: http://coordinator:8080
    depends_on:
      - coordinator
    volumes:
      - ./scratch/logs:/scratch/logs:ro
    restart: unless-stopped

  # Worker instance two uses a distinct configurable id and the same log files.
  worker-2:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      WORKER_ID: worker-2
      COORDINATOR_URL: http://coordinator:8080
    depends_on:
      - coordinator
    volumes:
      - ./scratch/logs:/scratch/logs:ro
    restart: unless-stopped

  # Worker instance three demonstrates horizontal worker scaling without host ports.
  worker-3:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      WORKER_ID: worker-3
      COORDINATOR_URL: http://coordinator:8080
    depends_on:
      - coordinator
    volumes:
      - ./scratch/logs:/scratch/logs:ro
    restart: unless-stopped

volumes:
  postgres-data:
